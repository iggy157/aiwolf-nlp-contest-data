# 大会定義の項目一覧。ここが唯一の仕様で、(1) 大会定義シート（1 冊、大会ごとにタブ）、(2) contest.yaml の検証、(3) 説明文 がここから作られる。
# label: シートの A 列に出る日本語名   use: C 列に出る用途（サイト / フォーム / サーバ / 通知）
# tier: every=毎回変える  sometimes=たまに変える  fixed=規則で決まる  auto=道具が書く
# type: text | text_en | int | bool | date | url | enum | list（カンマ区切り）
# 項目を足すときは行を足すだけ。使う側（サイトのショートコードや ops）が無い項目は記録されるだけで表示されない。
basic:
- key: name
  type: text
  tier: every
  required: true
  desc: '大会名（日本語）。結果ページや通知に出る。例: 2027 国際大会（INLG 2027）'
  label: 大会名
  use: サイト＊,フォーム＊,通知＊
- key: name_en
  type: text_en
  tier: every
  desc: '大会名（英語）。国際大会のみ。例: International Contest 2027 (INLG 2027)'
  label: 大会名（英語）
  use: サイト＊,フォーム
  required_en: true
- key: kind
  type: enum
  tier: every
  required: true
  options:
  - domestic
  - international
  desc: 国内大会なら domestic、国際大会なら international
  label: 国内 / 国際
  use: フォーム＊,サーバ＊
- key: language
  type: enum
  tier: every
  required: true
  options:
  - ja
  - en
  desc: 対戦で使う言語。フォームの併記やサーバのプロフィールの言語が決まる
  label: 対戦言語
  use: フォーム＊,サーバ＊
- key: site_language
  type: enum
  tier: every
  required: true
  options:
  - 日本語
  - 英語
  - 両方
  label: サイトの言語
  use: サイト＊
  desc: 大会ページを作る言語。英語・両方なら「大会_en」タブの＊の行も必須になる（対戦言語とは別）
- key: rules_profile
  type: enum
  tier: every
  required: true
  options:
  - international
  - domestic
  label: ルールセット
  use: サイト＊,サーバ＊
  desc: 「ルール」タブの列名から選ぶ（国際=international、国内=domestic）。値は contest.yaml の rules に展開される
- key: owners
  type: list
  tier: sometimes
  required: true
  desc: '担当者（Slack の通知の宛先）。運営ツールの config.yaml の people のキー。複数ならカンマかスペースで区切る。例: yharada, tanaka'
  label: 担当者
  use: 通知＊
- key: paper_submission
  type: bool
  tier: every
  desc: 論文投稿ページを設けるなら TRUE
  label: 論文投稿あり
  use: サイト,フォーム
- key: form_url
  type: url
  tier: auto
  desc: 参加フォームの URL。ops form create が自動で書く（空のままでよい）
  label: 参加フォーム URL
  use: サイト＊
- key: venue.name
  type: text
  tier: every
  required: true
  desc: '併催の学会・会議の名前。例: INLG 2027 / 人工知能学会全国大会2027 (JSAI2027)'
  label: 学会・会議の名前
  use: サイト＊
- key: venue.url
  type: url
  tier: every
  required: true
  desc: その公式サイトの URL
  label: 学会の URL
  use: サイト＊
- key: venue.place
  type: text
  tier: every
  desc: '開催地（日本語）。例: オランダ・ユトレヒト'
  label: 開催地
  use: サイト
- key: venue.place_en
  type: text_en
  tier: every
  desc: '開催地（英語）。例: Utrecht, the Netherlands'
  label: 開催地（英語）
  use: サイト
- key: venue.session
  type: text
  tier: every
  desc: 国内大会の企画セッション名（決まってから）。国際大会は空
  label: 企画セッション名
  use: サイト
- key: venue.start
  type: date
  tier: every
  required: true
  desc: 会期の初日。一覧の「次回大会／過去大会」の判定にも使う
  label: 学会期間（開始）
  use: サイト＊
- key: venue.end
  type: date
  tier: every
  required: true
  desc: 会期の最終日
  label: 学会期間（終了）
  use: サイト＊
- key: texts.character_prompt
  type: text
  tier: sometimes
  desc: キャラクター生成プロンプトの説明（レギュレーションの該当節に出る自由文。Markdown 可）
  label: キャラクター生成プロンプトの説明
  use: サイト
tracks:
  columns:
  - key: id
    type: text
    required: true
    desc: '識別子（変えない）。例: turn5 / turn9 / anytime5'
    label: 識別子
    use: 全部
  - key: name
    type: text
    required: true
    desc: '表示名（日本語）。例: ターン式 × 5人村'
    label: 名前
    use: サイト,フォーム
  - key: name_en
    type: text_en
    desc: 表示名（英語）
    label: 名前（英語）
    use: サイト,フォーム
  - key: size
    type: int
    required: true
    desc: 村の人数。役職構成は roles/<人数>.yaml
    label: 人数
    use: サーバ
  - key: mode
    type: enum
    required: true
    options:
    - turn
    - anytime
    desc: turn=ターン式 / anytime=いつでも発話
    label: 方式
    use: サーバ
  - key: games_min
    type: int
    desc: 'チーム当たり試合数の目安（下限）。例: 75'
    label: チーム当たり試合数（下限）
    use: サイト,サーバ
  - key: games_max
    type: int
    desc: '同（上限）。例: 100'
    label: チーム当たり試合数（上限）
    use: サイト,サーバ
  desc: 大会横断の「トラック」タブで管理する。大会側は回ごとの「実施トラック」に id を並べる
rounds:
  columns:
  - key: id
    type: text
    required: true
    desc: '識別子。例: r1 / r2、1 回だけなら main'
    label: 識別子
    use: 全部
  - key: name
    type: text
    desc: '表示名（日本語）。回が 2 つ以上のとき見出しとフォームの選択肢に使う。例: 1次（INLG main conference 向け）'
    label: 名前
    use: サイト,フォーム
  - key: name_en
    type: text_en
    desc: 表示名（英語）
    label: 名前（英語）
    use: サイト,フォーム
  - key: public_name
    type: text
    required: true
    desc: 'ログの公開ディレクトリ名。例: INLG / INLG2 / JSAI'
    label: ログの公開ディレクトリ名
    use: サーバ
  - key: tracks
    type: list
    required: true
    desc: 'この回で実施するトラック id をカンマ区切り。例: turn5, turn9, anytime5'
    label: 実施トラック
    use: フォーム,サーバ
milestones:
  columns:
  - key: round
    type: text
    required: true
    desc: 回の id（「回」シートの id）
    label: 回
    use: ''
  - key: key
    type: enum
    required: true
    options:
    - registration
    - connection_check
    - main_start
    - results
    - paper
    - notification
    - camera_ready
    - workshop
    - awards
    - other
    desc: 種類。registration=登録締切 main_start=本戦開始 results=結果返却 paper=論文締切 workshop=ワークショップ awards=表彰
    label: 種類
    use: ''
  - key: date
    type: date
    required: true
    desc: 日付
    label: 日付
    use: サイト
  - key: end
    type: date
    desc: 期間なら終わりの日付（空なら 1 日）
    label: 終了日（期間のとき）
    use: サイト
  - key: open
    type: bool
    desc: '「〜」付きで出すなら TRUE（例: 本戦開始「7月6日〜」）'
    label: 「〜」付き
    use: サイト
  - key: name
    type: text
    required: true
    desc: '表示文（日本語）。例: 参加登録締切／接続確認締切'
    label: 表示文
    use: サイト
  - key: name_en
    type: text_en
    desc: 表示文（英語）
    label: 表示文（英語）
    use: サイト
sponsors:
  columns:
  - key: name
    type: text
    required: true
    desc: 名前
    label: 名前
    use: サイト
  - key: name_en
    type: text_en
    desc: 英語名
    label: 名前（英語）
    use: サイト
  - key: url
    type: url
    desc: URL
    label: URL
    use: サイト
extra:
  desc: 仕組みに無い情報を一時的に持たせる場所。使う側ができたら basic に昇格させる
milestone_keys:
  registration: 登録締切
  connection_check: 接続確認締切
  main_start: 本戦開始
  results: 結果返却
  paper: 論文締切
  notification: 採択通知
  camera_ready: カメラレディ締切
  workshop: ワークショップ
  awards: 結果発表・表彰
  other: その他
rules:
  desc: 大会横断の「ルール」タブで管理する（行=項目、列=ルールセット名）
  keys:
  - key: talk_chars
    label: 1 発話の文字数上限
    type: int
    desc: '例: 国際 125、国内 50'
  - key: mention_chars
    label: メンション部分の上限
    type: int
    desc: 無ければ空（talk_chars と同じ）
  - key: response_timeout_sec
    label: 応答の制限時間（秒）
    type: int
    desc: '例: 60'
  - key: anytime_talks_per_day
    label: 'いつでも発話: 1 日の発話回数'
    type: int
    desc: '例: 4'
  - key: anytime_phase_min
    label: 'いつでも発話: 会話フェーズ（分）'
    type: int
    desc: '例: 10'
use_legend: D 列の用途。＊はその用途で必須。D1 で用途を選ぶと、必須の行が濃い黄色、使うだけの行が薄い黄色、空の必須が赤になる
